components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    AdverseMediaInfo:
      type: object
      properties:
        status:
          type: string
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
      required:
      - reports
      - status
    EntityDetails:
      type: object
