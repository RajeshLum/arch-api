  /api/reconcile/:
    get:
      operationId: api_reconcile_retrieve
      description: Handle GET request for entity reconciliation.
      summary: Reconcile local data with external ftm.json data
      parameters:
      - in: query
        name: entities
        schema:
          type: array
          items:
            type: string
        description: List of entities to reconcile, provided as JSON strings.
        required: true
      tags:
      - Reconcilation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  reconciled_entities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the matched entity.
                        name:
                          type: string
                          description: Name of the matched entity.
                        matched_score:
                          type: number
                          description: Confidence score of the match (0-1).
                        match_details:
                          type: object
                          description: Details of the match criteria.
                          properties:
                            name_match:
                              type: number
                              description: Similarity score for name matching (0-1).
                            birth_date_match:
                              type: boolean
                              description: Whether the birth date matched.
                            nationality_match:
                              type: boolean
                              description: Whether the nationality matched.
              examples:
                SuccessfulReconciliation:
                  value:
                    reconciled_entities:
                    - id: '1001'
                      name: John Doe
                      matched_score: 0.95
                      match_details:
                        name_match: 0.95
                        birth_date_match: true
                        nationality_match: true
                    - id: '1002'
                      name: Jane Smith
                      matched_score: 0.85
                      match_details:
                        name_match: 0.85
                        birth_date_match: false
                        nationality_match: false
                  summary: Successful Reconciliation
          description: Reconciliation results for the provided entities.
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No entities provided for reconciliation.
              examples:
                NoEntitiesProvided:
                  value:
                    error: No entities provided for reconciliation.
                  summary: No Entities Provided
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Reconciliation failed: <error_message>'
              examples:
                InternalServerError:
                  value:
                    error: 'Reconciliation failed: <error_message>'
                  summary: Internal Server Error
          description: Internal Server Error
  /api/search/:
    get:
      operationId: api_search_retrieve
      description: Performs a case-insensitive search across text fields of entity
        models. Results are sorted by relevance score.
      summary: Search entities across models
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Filter results by country
      - in: query
        name: entity_type
        schema:
          type: string
        description: Filter results by specific entity type (model name)
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: Maximum number of results to return
      - in: query
        name: q
        schema:
          type: string
        description: Search query string
        required: true
        examples:
          ExampleQuery:
            value: example search
            summary: Example Query
      - in: query
        name: topics
        schema:
          type: string
        description: Filter results by topics
      tags:
      - Sanction Query
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: integer
                    example: 10
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        relevance:
                          type: number
                        attributes:
                          type: object
                          additionalProperties: true
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: The 'q' parameter is required.
          description: ''
