openapi: 3.0.3
info:
  title: Arch Angel Datalake
  version: 1.0.0
  description: Backend API endpoints of ArchAngel Datalake
paths:
  /api/aml/risk/details/{entity_id}:
    get:
      operationId: api_aml_risk_details_retrieve
      description: Get detailed risk assessment information for a specific entity
        including sanctions, PEP status, geographic risk, and adverse media findings.
      summary: Fetch Risk Score Details
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
        description: Unique identifier for the entity
        required: true
      tags:
      - Risk Assessment
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskDetailsResponse'
              examples:
                SuccessfulResponse:
                  value:
                    entity_id: '1001'
                    name: John Doe
                    risk_score: 0.87
                    risk_category: High Risk
                    details:
                      sanctions:
                        status: Flagged
                        datasets:
                        - OFAC
                        - EU
                        confidence: 0.95
                      pep:
                        status: Not Flagged
                      geography:
                        status: High Risk
                        country: XYZ
                        reason: Listed as high-risk by FATF.
                      adverse_media:
                        status: Flagged
                        reports:
                        - source: News Article
                          details: Fraud accusation in 2023.
                  summary: Successful Response
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              examples:
                EntityNotFound:
                  value:
                    message: Entity not found
                  summary: Entity Not Found
          description: ''
  /api/aml/risk/score:
    post:
      operationId: api_aml_risk_score_create
      description: Calculate risk score for an entity based on provided entity and
        transaction information.
      summary: Submit Risk Scoring Request
      tags:
      - Risk Assessment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskScoringRequest'
            examples:
              SampleRequest:
                value:
                  entity:
                    name: John Doe
                    date_of_birth: '1975-04-21'
                    nationality: US
                    id_number: A12345678
                    address: 123 Main Street, New York, USA
                  transactions:
                    volume: 50000
                    frequency: 5
                summary: Sample Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RiskScoringRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RiskScoringRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskScoringResponse'
              examples:
                SuccessfulResponse:
                  value:
                    entity_id: '1001'
                    risk_score: 0.87
                    risk_category: High Risk
                    reasons:
                    - High confidence match on OFAC sanctions list.
                    - 'Located in high-risk jurisdiction (Country: XYZ).'
                    - Adverse media reports found (e.g., fraud accusations).
                    breakdown:
                      Sanctions Match: 0.4
                      PEP: 0.1
                      Geography: 0.2
                      Adverse Media: 0.15
                      Transactions: 0.02
                  summary: Successful Response
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                ValidationError:
                  value:
                    errors:
                      entity:
                        name:
                        - This field is required.
                  summary: Validation Error
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingError'
          description: ''
  /api/batch-status/{batch_id}/:
    get:
      operationId: api_batch_status_retrieve
      description: API endpoint to get the satus of uploading
      summary: Get the status of batch upload
      parameters:
      - in: path
        name: batch_id
        schema:
          type: string
          format: uuid
        description: UUID of the batch upload
        required: true
      tags:
      - Batch Processing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  file_name:
                    type: string
                  success_count:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        line_number:
                          type: integer
                        error_message:
                          type: string
              examples:
                BatchStatus:
                  value:
                    batch_id: 123e4567-e89b-12d3-a456-426614174000
                    status: completed
                    file_name: entities.json
                    success_count: 100
                    created_at: '2023-10-01T12:34:56Z'
                    updated_at: '2023-10-01T12:35:10Z'
                    errors:
                    - line_number: 5
                      error_message: Invalid JSON format
                    - line_number: 10
                      error_message: Missing required field
                  summary: Batch Status
          description: Batch status retrieved successfully.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                BatchNotFound:
                  value:
                    error: Batch ID not found.
                  summary: Batch Not Found
          description: Not Found
  /api/batch-upload/:
    post:
      operationId: api_batch_upload_create
      description: API endpoint to upload entities file
      summary: Upload ftm.json file as batch
      tags:
      - Batch Processing
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JSON file containing entities data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                    format: uuid
                  message:
                    type: string
                  success_count:
                    type: integer
                  errors:
                    type: integer
              examples:
                SuccessfulUpload:
                  value:
                    batch_id: 123e4567-e89b-12d3-a456-426614174000
                    message: File processed successfully.
                    success_count: 100
                    errors: 2
                  summary: Successful Upload
          description: File processed successfully.
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                InvalidFileType:
                  value:
                    error: Invalid file type. Only JSON files are allowed.
                  summary: Invalid File Type
          description: Bad Request
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  batch_id:
                    type: string
                    format: uuid
          description: Internal Server Error
  /api/entities/{entity_id}/:
    get:
      operationId: api_entities_retrieve
      description: API endpoint to fetch detailed information for a specific SanctionedEntity.
      summary: Fetch detailed information for a specific SanctionedEntity
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
        description: Unique identifier of the entity (sanctionId).
        required: true
      tags:
      - Sanction Query
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the entity.
                  name:
                    type: string
                    description: Name of the entity.
                  attributes:
                    type: object
                    description: Additional attributes of the entity.
                    properties:
                      birthDate:
                        type: string
                        format: date
                        description: Birth date of the entity.
                      nationality:
                        type: string
                        description: Nationality of the entity.
                      address:
                        type: string
                        description: Address of the entity.
                  linkedEntities:
                    type: array
                    description: List of entities linked to this entity (e.g., family
                      members, subsidiaries).
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the linked entity.
                        type:
                          type: string
                          description: Type of the linked entity (e.g., FamilyMember,
                            Subsidiary).
                        name:
                          type: string
                          description: Name of the linked entity.
              examples:
                EntityDetails:
                  value:
                    id: '1001'
                    name: John Doe
                    attributes:
                      birthDate: '1975-04-21'
                      nationality: US
                      address: 123 Main Street, NY
                    linkedEntities:
                    - id: '2001'
                      type: FamilyMember
                      name: Jane Doe
                  summary: Entity Details
          description: Entity details retrieved successfully.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Entity not found.
              examples:
                EntityNotFound:
                  value:
                    detail: Entity not found.
                  summary: Entity Not Found
          description: Not Found
